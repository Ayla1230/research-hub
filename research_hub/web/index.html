<!doctype html>
<html lang="{{HTML_LANG}}" data-lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="hub-token" content="{{TOKEN}}">
  <meta name="hub-version" content="{{VERSION}}">
  <meta name="color-scheme" content="light">
  <title>{{TITLE}}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css?v={{VERSION}}">
  <script src="/static/js/i18n.js?v={{VERSION}}" defer></script>
  <script src="/static/js/core.js?v={{VERSION}}" defer></script>
  <script src="/static/js/pipeline.js?v={{VERSION}}" defer></script>
  <script src="/static/js/research.js?v={{VERSION}}" defer></script>
  <script src="/static/js/hub.js?v={{VERSION}}" defer></script>
  <script src="/static/js/checkin.js?v={{VERSION}}" defer></script>
  <script src="/static/js/app.js?v={{VERSION}}" defer></script>
</head>
<body>
  <a class="skip" href="#main">{{SKIP}}</a>
  <header class="topbar" id="topbar"></header>
  <main id="main">
    <section class="hero" id="hero" aria-labelledby="hero-title"></section>
    <section class="band" id="pipeline" aria-label="{{PIPELINE}}"></section>
    <section class="band" id="core"></section>
    <section class="band" id="hub"></section>
    <section class="band" id="activity"></section>
  </main>
  <footer class="foot" id="foot"></footer>
  <div id="layer"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript>{{NOSCRIPT}}</noscript>
</body>
</html>
