[project]
name = "research-hub"
version = "1.1.0"
description = "Research Hub — a local thesis-progress dashboard (研究進度中樞)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
research-hub = "research_hub.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["research_hub*"]

[tool.setuptools.package-data]
research_hub = ["web/*", "web/**/*"]
